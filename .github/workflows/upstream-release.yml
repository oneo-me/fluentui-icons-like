name: Update upstream and publish

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: bun install --frozen-lockfile
      - run: bun run test
      - name: Prepare or resume release
        id: prepare
        run: bun scripts/release.mjs prepare
      - name: Publish packages and complete release
        if: steps.prepare.outputs.prepared == 'true'
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun scripts/release.mjs publish
